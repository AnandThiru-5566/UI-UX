
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideEase - Confirm Booking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .mobile-screen {
            width: 340px;
            max-width: 100%;
            height: 735px;
            max-height: 95vh;
            min-height: 600px;
            background-color: #fbe3fc;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 60px;
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .back {
            font-size: 32px;
            color: #222;
        }

        .logo {
            font-size: 19px;
            font-weight: bold;
            color: black;
        }

        .logo span {
            color: #b000ff;
        }

        .menu {
            font-size: 25px;
            color: #222;
        }

        /* Main content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 13px;
        }

        .section {
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 22px;
        }

        .trip-details {
            background-color: #5cda88;
        }

        .vehicles {
            background-color: #75d7d9;
            padding: 20px 9px 11px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        .edit {
            color: #7200e9;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        /* Pickup and destination */
        .location {
            background: white;
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            min-height: 40px;
        }

        .location:last-child {
            margin-bottom: 0;
        }

        .location-icon {
            font-size: 18px;
        }

        .pickup-icon {
            color: #5cda88;
        }

        .destination-icon {
            color: #ff334c;
        }

        .location strong {
            font-size: 12px;
            display: block;
        }

        .location small {
            color: #777;
            font-size: 10px;
            display: block;
            margin-top: 2px;
        }

        /* Vehicle list */
        .vehicle-row {
            background-color: white;
            border-radius: 11px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
            min-height: 50px;
            font-size: 12px;
        }

        .vehicle-name {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: bold;
        }

        .vehicle-icon {
            font-size: 29px;
        }

        .price {
            font-size: 12px;
            font-weight: bold;
            padding-right: 1px;
        }

        /* Total fare */
        .total-fare {
            background-color: #c8b8ed;
            border-radius: 14px;
            padding: 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -3px 0 19px;
            box-shadow: 0 5px 10px #00000010;
        }

        .total-fare strong {
            font-size: 14px;
        }

        .total-fare span {
            color: #5700bd;
            font-size: 14px;
            font-weight: bold;
        }

        /* Payment options */
        .payment-options {
            display: flex;
            gap: 7px;
            margin-bottom: 19px;
        }

        .payment-options input {
            display: none;
        }

        .payment-options label {
            background-color: white;
            border: 1px solid #e3dce8;
            border-radius: 11px;
            padding: 11px 5px;
            flex: 1;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .payment-options input:checked + label {
            background-color: #6900e9;
            color: white;
            border-color: #6900e9;
        }

        /* Confirm button */
        .confirm-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 13px;
            background-color: #6900e9;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 10px #00000015;
        }

        .confirm-btn:hover {
            background-color: #5100b8;
        }

        /* Bottom navigation */
        .bottom-nav {
            height: 63px;
            background-color: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #666;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            min-width: 50px;
        }

        .nav-icon {
            font-size: 19px;
            color: #222;
        }

        .nav-item.active {
            color: #6900e9;
        }

        .nav-item.active .nav-icon {
            background-color: #00e5df;
            border-radius: 20px;
            padding: 4px 10px;
            color: #111;
            font-size: 16px;
        }

        @media (max-width: 380px) {
            .mobile-screen {
                width: 100%;
            }

            .content {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="mobile-screen">

        <!-- Header -->
        <header class="header">
            <div class="back">&#8249;</div>

            <div class="logo">
                🚘 Ride<span>Ease</span>
            </div>

            <div class="menu">&#9776;</div>
        </header>

        <!-- Main Content -->
        <main class="content">

            <!-- Trip Details -->
            <section class="section trip-details">

                <div class="section-heading">
                    <span>Trip Details</span>
                    <a href="#" class="edit">Edit</a>
                </div>

                <div class="location">
                    <span class="location-icon pickup-icon">●</span>
                    <div>
                        <strong>Pickup:</strong>
                        <small>Anaicut, Vellore</small>
                    </div>
                </div>

                <div class="location">
                    <span class="location-icon destination-icon">●</span>
                    <div>
                        <strong>Destination:</strong>
                        <small>VIT, Vellore</small>
                    </div>
                </div>

            </section>

            <!-- Selected Vehicles -->
            <section class="section vehicles">

                <div class="section-heading">
                    <span>Selected Vehicles</span>
                    <a href="#" class="edit">Edit</a>
                </div>

                <div class="vehicle-row">
                    <div class="vehicle-name">
                        <span class="vehicle-icon">🚕</span>
                        <span>Car (Sedan) × 1</span>
                    </div>
                    <span class="price">₹320</span>
                </div>

                <div class="vehicle-row">
                    <div class="vehicle-name">
                        <span class="vehicle-icon">🛺</span>
                        <span>Auto × 1</span>
                    </div>
                    <span class="price">₹60</span>
                </div>

                <div class="vehicle-row">
                    <div class="vehicle-name">
                        <span class="vehicle-icon">🏍️</span>
                        <span>Bike × 1</span>
                    </div>
                    <span class="price">₹45</span>
                </div>

            </section>

            <!-- Total Estimated Fare -->
            <section class="total-fare">
                <strong>Total Estimated Fare</strong>
                <span>₹425</span>
            </section>

            <!-- Payment Methods -->
            <div class="payment-options">

                <input type="radio" name="payment"
                       id="upi" value="UPI" checked>
                <label for="upi">UPI</label>

                <input type="radio" name="payment"
                       id="cod" value="COD">
                <label for="cod">COD</label>

                <input type="radio" name="payment"
                       id="credit" value="Credit Card">
                <label for="credit">Credit Card</label>

            </div>

            <!-- Confirm Booking -->
            <button class="confirm-btn" onclick="confirmBooking()">
                Confirm Booking
            </button>

        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">◷</span>
                <span>Rides</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">♡</span>
                <span>Saved</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">♙</span>
                <span>Profile</span>
            </a>

        </nav>

    </div>

    <script>
        function confirmBooking() {
            const payment = document.querySelector(
                'input[name="payment"]:checked'
            ).value;

            alert(
                "Booking confirmed!\n" +
                "Total Fare: ₹425\n" +
                "Payment Method: " + payment
            );
        }
    </script>

</body>
</html>
